<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#100e19">
    <meta name="description" content="Group 7's learning app for Cloud Security and IAS 2.">
    <title>SecPath · Cybersecurity Learning</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/home"><img src="./assets/icon-192.png" width="38" height="38" alt=""><span>SecPath</span></a>
        <nav class="desktop-nav" aria-label="Main navigation"></nav>
        <button class="button install-button" type="button" data-action="install"><span></span>Install app</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <span>SecPath · Group 7</span>
      <span>PUP College of Computer and Information Sciences</span>
    </footer>
    <nav class="mobile-nav" aria-label="Mobile navigation"></nav>
    <dialog id="install-dialog" aria-labelledby="install-title">
      <form method="dialog">
        <button class="icon-button dialog-close" value="close" aria-label="Close">×</button>
        <h2 id="install-title">Install SecPath</h2>
        <p>Open your browser menu and choose <strong>Install app</strong> or <strong>Add to Home Screen</strong>.</p>
        <p>On iPhone or iPad, open SecPath in Safari, tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.</p>
        <button class="button primary" value="close">Got it</button>
      </form>
    </dialog>
    <noscript>Enable JavaScript to open SecPath.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
